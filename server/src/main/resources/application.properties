# SQLite file lives alongside the server module (relative to wherever spring-boot:run's
# working directory is -- server/ when run the normal way from the repo root).
spring.datasource.url=jdbc:sqlite:kungfuchess.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update (not create-drop): ratings must survive a server restart.
spring.jpa.hibernate.ddl-auto=update
