# Separate file from the real gameplay DB, wiped at the start/end of each test context so
# accounts created by one test run never leak into another (or into real play).
spring.datasource.url=jdbc:sqlite:test-kungfuchess.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
